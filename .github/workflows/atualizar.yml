
name: Atualizar portal esportivo

on:
  schedule:
    - cron: "0 10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do site
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar notícias
        run: python atualizar.py

      - name: Salvar notícias no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verifica se a pasta existe antes de adicionar
          if [ -d "noticias" ]; then
            git add noticias/
          fi
          
          # Apenas faz commit se houver alterações
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar notícias"
            git push
          else
            echo "Nenhuma alteração para salvar."
          fi
